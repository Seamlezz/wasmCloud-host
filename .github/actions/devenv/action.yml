name: devenv
description: Nix, devenv and the caches every job shares
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # The sha makes every run save, so incremental builds stay warm.
        key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
        restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
    - shell: bash
      run: nix profile add nixpkgs#devenv
