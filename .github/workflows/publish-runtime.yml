name: publish-runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - run: devenv shell -- check

  needs-publish:
    runs-on: ubuntu-latest
    outputs:
      needs-publish: ${{ steps.gate.outputs.needs-publish }}
    permissions:
      contents: read
      packages: read
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - run: devenv shell -- ghcr-login
      - id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          set -euo pipefail
          result="$(devenv shell -- needs-publish $FORCE | tail -n 1)"
          echo "needs-publish=$result" >> "$GITHUB_OUTPUT"

  publish-platform:
    needs: [check, needs-publish]
    if: needs.needs-publish.outputs.needs-publish == 'true'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - run: devenv shell -- ghcr-login
      - run: devenv shell -- publish-platform "${{ matrix.platform }}"

  manifest:
    needs: [publish-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - run: devenv shell -- ghcr-login
      - run: devenv shell -- publish-manifest
