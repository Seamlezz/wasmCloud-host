[workspace]
resolver = "3"
members = ["crates/plugins/surrealdb/", "crates/runtime/"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.100.0"
repository = "https://github.com/Seamlezz/wasmCloud-host"
license = "Unlicense"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
async-trait = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
surrealdb = {
  version = "4",
  default-features = false,
  features = ["kv-mem", "protocol-http", "protocol-ws", "rustls"]
}
surrealdb-host-adapter = { git = "https://github.com/Seamlezz/surrealdb-wasi-component", rev = "6357b6d0bcc065f152f202f34f2f58525d1a961a" }
surrealdb-types = "4"
tokio = { version = "1", default-features = false, features = ["full"] }
tracing = {
  version = "0.1",
  default-features = false,
  features = ["attributes"]
}
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = {
  version = "0.3",
  default-features = false,
  features = ["env-filter", "fmt"]
}
wash-runtime = {
  git = "https://github.com/gabber235/wasmCloud",
  rev = "67e9e198742e6061dcc6fc8b378d02daa9b3a2a7",
  default-features = false,
}
wash = { git = "https://github.com/gabber235/wasmCloud", rev = "67e9e198742e6061dcc6fc8b378d02daa9b3a2a7", default-features = false, features = ["wasm_component_model_implements"] }
wasmcloud-plugin-surrealdb = { path = "crates/plugins/surrealdb" }
wasmtime = {
  version = "48.0.9",
  default-features = false,
  features = [
    "component-model",
    "component-model-async",
  ]
}
