[workspace]
resolver = "3"
members = ["crates/plugins/surrealdb/", "crates/runtime/"]

[workspace.package]
version = "2.1.6"
edition = "2024"
rust-version = "1.95.0"
repository = "https://github.com/Seamlezz/wasmCloud-host"
license = "Unlicense"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
async-nats = {
  version = "0.49.1",
  default-features = false,
  features = [
    "aws-lc-rs",
    "jetstream",
    "kv",
    "nkeys",
    "object-store",
    "service"
  ]
}
async-trait = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
humantime = { version = "2" }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
surrealdb = {
  version = "3",
  default-features = false,
  features = ["kv-mem", "protocol-http", "protocol-ws", "rustls"]
}
surrealdb-host-adapter = "0.7"
surrealdb-types = "3"
tokio = { version = "1", default-features = false, features = ["full"] }
tracing = {
  version = "0.1",
  default-features = false,
  features = ["attributes"]
}
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = {
  version = "0.3",
  default-features = false,
  features = ["env-filter", "fmt"]
}
wash-runtime = {
  git = "https://github.com/gabber235/wasmCloud",
  rev = "f61bb5c8281d1b3b2118aeb96697402abe5d4e04",
  default-features = false,
}
wasmcloud-plugin-surrealdb = { path = "crates/plugins/surrealdb" }
wasmtime = {
  version = "47.0.3",
  default-features = false,
  features = [
    "component-model",
    "component-model-async",
  ]
}
